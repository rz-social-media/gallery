name: Deploy Media API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infrastructure/media-api/**"
      - ".github/workflows/deploy-media-api.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/media-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infrastructure/media-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Configure Worker secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          ADMIN_ACCESS_CODE: ${{ secrets.ADMIN_ACCESS_CODE }}
        run: |
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY
          printf '%s' "$MUX_TOKEN_ID" | npx wrangler secret put MUX_TOKEN_ID
          printf '%s' "$MUX_TOKEN_SECRET" | npx wrangler secret put MUX_TOKEN_SECRET
          printf '%s' "$ADMIN_ACCESS_CODE" | npx wrangler secret put ADMIN_ACCESS_CODE
      - name: Deploy Worker
        run: npx wrangler deploy
