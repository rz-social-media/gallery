name: Deploy Cloudflare Pages

# rz-gallery.pages.dev: the same site at the domain root, with clean gallery
# URLs and per-gallery link previews (cloudflare/_worker.js).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "cloudflare/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
      - run: cp cloudflare/_worker.js out/_worker.js
      - name: Create project (first run only)
        run: npx wrangler pages project list | grep -q "rz-gallery" || npx wrangler pages project create rz-gallery --production-branch main
      - name: Deploy
        run: npx wrangler pages deploy out --project-name rz-gallery --branch main --commit-dirty=true
